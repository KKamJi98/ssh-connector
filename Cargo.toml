[package]
name = "kkamji-ssh-connector"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Pick a host from your ~/.ssh/config in a table and connect to it with ssh"
license = "MIT"
repository = "https://github.com/KKamJi98/ssh-connector"
homepage = "https://github.com/KKamJi98/ssh-connector"
readme = "README.md"
keywords = ["ssh", "cli", "ssh-config", "picker"]
categories = ["command-line-utilities"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "ssh-connector"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "error-context", "help", "usage", "color", "suggestions"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
ctrlc = "3.5"
glob = "0.3"
terminal_size = "0.4"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.2"
serde_json = "1"
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = true
strip = true
