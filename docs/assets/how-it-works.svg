<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1170" role="img" aria-labelledby="title desc">
  <title id="title">Your SSH config in. OpenSSH out.</title>
  <desc id="desc">ssh-connector reads host aliases from the main SSH config and included files, groups them by file, and lets you select a host. It starts system ssh with the selected alias and inherits the terminal. Your config is not rewritten, and the SSH exit code is returned.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="1170" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172033">
    <text x="40" y="48" font-size="28" font-weight="700">Your SSH config in. OpenSSH out.</text>
    <text x="40" y="79" font-size="16" fill="#475569">A host picker in front of the SSH client you already use.</text>

    <g id="connectors" fill="none" stroke="#64748b" stroke-width="2">
      <path id="config-fanout" d="M450 220 V265 M225 265 H675"/>
      <line id="main-source" x1="225" y1="265" x2="225" y2="310" marker-end="url(#arrow)"/>
      <line id="included-source" x1="675" y1="265" x2="675" y2="310" marker-end="url(#arrow)"/>

      <line id="main-aliases" x1="225" y1="420" x2="225" y2="465"/>
      <line id="included-aliases" x1="675" y1="420" x2="675" y2="465"/>
      <path id="alias-fanin" d="M225 465 H675 M450 465 V510" marker-end="url(#arrow)"/>

      <line id="visible-hosts" x1="450" y1="660" x2="450" y2="750" marker-end="url(#arrow)"/>
      <line id="selected-alias" x1="450" y1="850" x2="450" y2="940" marker-end="url(#arrow)"/>
    </g>
    <g font-size="17" dominant-baseline="middle" fill="#475569">
      <text x="468" y="242.5">Config sources</text>
      <text x="468" y="487.5">Host aliases</text>
      <text x="468" y="705">Visible hosts</text>
      <text x="468" y="895">Selected alias</text>
    </g>

    <rect id="discovery" x="120" y="115" width="660" height="105" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="142" y="145" font-size="16" font-weight="600" fill="#64748b">01 / READ EXISTING CONFIG</text>
    <text x="142" y="183" font-size="17" fill="#475569">Follow Include paths; read host aliases from both.</text>

    <rect id="main-config" x="60" y="310" width="330" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="82" y="345" font-size="18" font-weight="600">Main file</text>
    <text x="82" y="383" font-size="22" font-weight="600">~/.ssh/config</text>
    <rect id="included-config" x="510" y="310" width="330" height="110" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="532" y="345" font-size="20" font-weight="600">Included files</text>
    <text x="532" y="383" font-size="17" fill="#475569">e.g. config.d/lab</text>

    <rect id="groups" x="120" y="510" width="660" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="142" y="540" font-size="16" font-weight="600" fill="#1d4ed8">02 / GROUP BY SOURCE FILE</text>
    <text x="142" y="574" font-size="22" font-weight="700">ssh-connector</text>
    <text x="142" y="608" font-size="18">Main</text><text x="270" y="608" font-size="18" fill="#475569">web-01, bastion</text>
    <text x="142" y="638" font-size="18">lab</text><text x="270" y="638" font-size="18" fill="#475569">web-02, api-01</text>

    <rect id="selection" x="120" y="750" width="660" height="100" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="142" y="780" font-size="16" font-weight="600" fill="#6d28d9">03 / PICK A HOST</text>
    <text x="142" y="816" font-size="22" font-weight="600">Number, name, or filter</text>

    <rect id="ssh" x="120" y="940" width="660" height="110" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="142" y="970" font-size="16" font-weight="600" fill="#166534">04 / START SYSTEM OPENSSH</text>
    <text x="142" y="1006" font-size="22" font-weight="700">ssh -- &lt;host&gt;</text>
    <text x="142" y="1034" font-size="17" fill="#475569">Inherited TTY. SSH exit code returned.</text>

    <text x="120" y="1090" font-size="18" font-weight="600">No second host inventory.</text>
    <text x="120" y="1118" font-size="16" fill="#475569">ssh-connector never rewrites your SSH config.</text>
    <text x="120" y="1146" font-size="16" fill="#475569">OpenSSH still handles keys, User, ProxyJump, and authentication.</text>
  </g>
</svg>
