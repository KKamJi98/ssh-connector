# cargo-deny: run in CI (ci.yml) and locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Any RustSec advisory or unmaintained notice fails the check.
unmaintained = "all"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
