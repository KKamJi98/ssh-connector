name: CI

# main is deliberately absent: release.yml runs the same checks there as the gate
# in front of releasing, so covering main here too would run every test twice per
# push for no extra signal.
on:
  push:
    branches-ignore: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The two ends that can actually break: 3.10 is the floor requires-python
      # promises, 3.13 is what a fresh `uv tool install` picks today. The floor
      # used to read 3.13 and shut out everyone below it for no reason; the
      # suite passes on 3.10.
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run --group dev ruff check --output-format=github .

      - name: Format check with ruff
        run: uv run --group dev ruff format --check .

      - name: Test with pytest
        run: uv run --group dev pytest -q

  # Moved to release.yml, which owns the whole release path. Keeping it here
  # would have split the release across two files, and the tag it produces was
  # never going to reach release.yml's old `push: tags` trigger anyway.
