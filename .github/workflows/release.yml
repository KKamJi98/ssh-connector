# Everything a release touches, from the version bump to the upload.
#
# The trigger is a push to main rather than a tag, and that is not a preference.
# The release is driven off release-please's own release_created output, the
# shape it documents, so build and publish run in the same run that cut the
# release and nothing waits on a second workflow.
#
# release-please runs on a short-lived GitHub App installation token, not the
# default GITHUB_TOKEN. GitHub holds pull_request runs on a PR that
# GITHUB_TOKEN opened or updated (action_required, zero jobs) and expires them
# as failures after 30 days, so the release PR never got CI. The App token
# lifts that. It also means the tag and the GitHub release now raise events
# that do start workflows: do not add a `push: tags` or `release` trigger that
# publishes, or every release goes to PyPI twice. No long-lived PAT is used.
name: release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # main skips CI, so the gate lives here. A release must not go out on code that
  # was never run, and a direct push to main would otherwise reach the publish
  # job having been checked by nothing.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'

      - name: Lint
        run: |
          uv run --group dev ruff check .
          uv run --group dev ruff format --check .

      - name: Test
        run: uv run --group dev pytest -q

  # Every write here goes through the App token, so GITHUB_TOKEN gets nothing.
  # The token is scoped to this repository (no owner/repositories input) and to
  # the two permissions release-please needs: contents for the release commit,
  # tag and GitHub release, pull-requests for the release PR and its labels.
  release-please:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: python
          package-name: ssh-connector

  # release-please tags the very commit this run is building, so a plain checkout
  # is already at the released code. Nothing reads the tag name into a ref.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # PyPI Trusted Publishing: the job mints an OIDC token that PyPI exchanges for
  # a short-lived upload token, so there is no API token in Secrets to leak or
  # rotate. id-token: write is what allows the mint and the only permission here.
  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # release-please already opens the GitHub release; this only hangs the built
  # wheel and sdist on it, so the release carries the artifact rather than just
  # pointing at PyPI.
  #
  # This stays on GITHUB_TOKEN on purpose. Uploading an asset raises no event
  # anything listens for, so the App token would buy nothing here, and keeping
  # it out of this job keeps the App credentials in one place.
  attach-artifacts:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag="$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')"
          gh release upload "$tag" dist/* --repo "$REPO" --clobber
