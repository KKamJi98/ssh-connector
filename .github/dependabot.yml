version: 2
updates:
  # Every action is pinned to a commit SHA, so nothing moves on its own. This
  # entry is what keeps those pins current: one grouped PR a week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Cargo.lock pins every crate; this keeps them current the same way.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
